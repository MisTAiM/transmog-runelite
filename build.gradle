plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

// Strip out non-Windows-x64 LWJGL natives that don't exist in Maven local
// and cause ArtifactNotFoundException on Windows dev machines
configurations.all {
	exclude group: 'org.lwjgl', module: 'lwjgl-opengl-natives-linux-arm64'
	exclude group: 'org.lwjgl', module: 'lwjgl-natives-linux-arm64'
	exclude group: 'org.lwjgl', module: 'lwjgl-opengl-natives-linux-aarch64'
	exclude group: 'org.lwjgl', module: 'lwjgl-natives-linux-aarch64'
	exclude group: 'org.lwjgl', module: 'lwjgl-opengl-natives-macos'
	exclude group: 'org.lwjgl', module: 'lwjgl-natives-macos'
	exclude group: 'org.lwjgl', module: 'lwjgl-opengl-natives-macos-arm64'
	exclude group: 'org.lwjgl', module: 'lwjgl-natives-macos-arm64'
}

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.20'
	annotationProcessor 'org.projectlombok:lombok:1.18.20'

	testImplementation 'junit:junit:4.12'
	testImplementation 'org.mockito:mockito-core:3.1.0'
    testImplementation 'com.google.inject.extensions:guice-testlib:4.1.0'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'io.hydrox.transmog'
version = '1.3.8'

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}
