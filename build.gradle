plugins {
	id 'java'
}

repositories {
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.36'
	annotationProcessor 'org.projectlombok:lombok:1.18.36'

	testImplementation 'junit:junit:4.12'
	testImplementation 'org.mockito:mockito-core:3.1.0'
	testImplementation 'com.google.inject.extensions:guice-testlib:4.1.0'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'io.hydrox.transmog'
version = '1.3.8'

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	// Allow Lombok annotation processor to access Java internals on Java 17+
	options.forkOptions.jvmArgs += [
		'--add-opens=java.base/java.lang=ALL-UNNAMED',
		'--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
		'--add-opens=java.base/java.util=ALL-UNNAMED',
		'--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
		'--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED',
		'--add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
		'--add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED',
		'--add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
		'--add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED',
		'--add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
		'--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
		'--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
		'--add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED',
	]
	options.fork = true
}

task run(type: JavaExec, dependsOn: jar) {
	group = 'runelite'
	description = 'Launch RuneLite with this plugin loaded'
	classpath = configurations.testRuntimeClasspath + files(jar.archiveFile)
	mainClass = 'net.runelite.client.RuneLite'
	jvmArgs '-ea',
		"-Drunelite.pluginhub.version=${runeLiteVersion}",
		'--add-opens=java.base/java.lang=ALL-UNNAMED',
		'--add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED'
}

jar {
	manifest {
		attributes('Implementation-Version': project.version)
	}
}
